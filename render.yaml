# Render blueprint: one long-running web service (the app runs Qloo's harness as a child process).
# Plan: "free" runs the app, with three costs for a judged demo:
#   - it sleeps after 15 idle minutes, and the first visit after that waits about a minute;
#   - it has no disk, so every sleep or deploy wipes the runs and the Qloo cache: share links (/s/…) from before
#     stop working, and each wake reads the showcases from Qloo again (about 150 requests with PREWARM=1);
#   - it has 0.1 CPU, so a showcase takes longer than on a laptop.
# For the judging window, "starter" with the disk below keeps share links and the cache across restarts.
services:
  - type: web
    name: ayto
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    # Uncomment with plan: starter (disks need a paid plan). CACHE_DIR must match mountPath.
    # disk:
    #   name: ayto-cache
    #   mountPath: /app/.cache
    #   sizeGB: 1
    envVars:
      # Required.
      - key: QLOO_API_KEY
        sync: false
      # The server's own writer. Set ONE of: GROQ_API_KEY (free at console.groq.com), ANTHROPIC_API_KEY,
      # or LLM_PROVIDER (e.g. deepseek) with LLM_API_KEY. Visitors can still bring their own key.
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_API_KEY
        sync: false
      # Spend guards for the server's key, per day.
      - key: MAX_LLM_RUNS_PER_DAY
        value: "60"
      - key: MAX_RUNS_PER_DAY
        value: "150"
      # Run the three showcases at boot so the home page and gallery are ready.
      - key: PREWARM
        value: "1"
